[project]
name = "encore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ranvir7123", email = "ranvir7123@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.2.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
]

[project.scripts]
encore = "encore.cli:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
