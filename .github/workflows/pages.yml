# Publishes web/ (the evidence site) to GitHub Pages on every push to main.
# web/ is self-contained: index.html, data/*.json and py/*.py are generated by
# `encore web` and committed, so the deploy is a plain static upload with no
# build step and nothing here can drift from what the tests saw.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
